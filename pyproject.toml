[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aereo-geospatial-measurement-api"
version = "0.1.0"
description = "Backend API for geospatial file ingestion and measurement."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio>=4.4,<4.10",
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<0.116",
    "fiona>=1.10,<2.0",
    "geoalchemy2>=0.15,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyproj>=3.7,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "shapely>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
